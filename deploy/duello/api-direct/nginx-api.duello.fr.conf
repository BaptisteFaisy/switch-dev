# api.duello.fr — reverse proxy vers l'API Duello (origine locale 8891,
# identique au port d'origine utilisé par le tunnel duello-api).
#
# État initial : bloc HTTP (port 80) uniquement. `certbot --nginx` ajoute
# ensuite le bloc 443 + la redirection HTTP → HTTPS, puis apply-api-direct.sh
# transforme le bind 443 en IP privée (voir ci-dessous et le script).
#
# ⚠️ Bind 443 : ne PAS utiliser un `listen 443 ssl;` wildcard sur ce VPS :
#   - tailscaled (`tailscale serve`, HTTPS du tailnet azure-duello) occupe déjà
#     443 sur ses adresses → EADDRINUSE ;
#   - l'IP publique n'existe pas sur une interface (NAT Azure) → EADDRNOTAVAIL.
#   Le script réécrit donc la ligne en `listen <IP privée>:443 ssl;` (Azure
#   NAT fait la translation IP publique → IP privée).
#
# Ce fichier est installé sur le VPS dans
#   /etc/nginx/sites-available/api.duello.fr
# avec un lien symbolique dans /etc/nginx/sites-enabled/.

server {
    listen 80;
    listen [::]:80;
    server_name api.duello.fr;

    # Les échanges de l'app peuvent porter de gros corps (contenus, uploads).
    # La valeur par défaut d'nginx (1 m) est trop basse.
    client_max_body_size 200m;

    location / {
        # Sans URI de fin : le chemin complet de la requête est transmis tel quel
        # (ex. /api/auth/... → http://127.0.0.1:8891/api/auth/...), comme le
        # faisait le tunnel. Ne pas ajouter de slash à la fin de proxy_pass.
        proxy_pass http://127.0.0.1:8891;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

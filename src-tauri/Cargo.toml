[package]
name = "codex-switch-terminal"
version = "0.1.0"
description = "Tauri terminal for switching Codex accounts and proxies"
authors = ["jeanp"]
edition = "2021"
default-run = "codex-switch-terminal"

[features]
# Le serveur web est la cible par defaut et ne doit pas embarquer le contexte
# graphique Tauri (qui exige les ressources d'icone propres a chaque OS).
default = []
desktop = [
  "dep:rfd",
  "dep:tauri",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-updater",
  "tauri/wry",
  "tauri/compression",
  "tauri/common-controls-v6",
  "tauri/dynamic-acl",
  "tauri/x11",
  "tauri/dbus",
]

[lib]
name = "codex_switch_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-switch-terminal"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "cst-server"
path = "src/bin/cst-server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.2"
tauri = { version = "2", optional = true, default-features = false, features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal"] }
axum = { version = "0.7", features = ["json", "ws"] }
tower-http = { version = "0.5", features = ["compression-br", "compression-gzip", "cors", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "charset", "http2", "blocking"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
base64 = "0.22"
bs58 = "0.5"
flate2 = "1"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = { version = "0.15", optional = true }
uuid = { version = "1", features = ["v4"] }
yup-oauth2 = "12.1.2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[patch.crates-io]
tauri-utils = { path = "vendor/tauri-utils-2.9.3" }
portable-pty = { path = "vendor/portable-pty-0.9.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Profil du runtime headless construit directement sur un VPS. Les chats sont
# surtout bornes par le provider et les E/S : un LTO couteux n'apporte pas assez
# pour justifier un linkage de plusieurs dizaines de minutes sur une petite VM.
[profile.server]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true

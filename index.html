<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Codex Terminal" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (() => {
        if (/CodexTerminalAndroid/i.test(navigator.userAgent)) {
          document.documentElement.classList.add("native-android");
        }
        let theme = "dark";
        try {
          const remoteBaseKey = "codex-switch-terminal.remote.base-url";
          const savedRemoteBase = localStorage.getItem(remoteBaseKey)?.trim();
          if (savedRemoteBase) {
            try {
              const savedUrl = new URL(savedRemoteBase);
              const loopbackHosts = new Set(["127.0.0.1", "localhost", "::1"]);
              if (
                loopbackHosts.has(savedUrl.hostname.toLowerCase())
                && !loopbackHosts.has(window.location.hostname.toLowerCase())
              ) {
                localStorage.removeItem(remoteBaseKey);
              }
            } catch {
              localStorage.removeItem(remoteBaseKey);
            }
          }
          theme = localStorage.getItem("codex-switch-terminal.theme") === "light" ? "light" : "dark";
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "light" ? "#f4f6f3" : "#000000",
        );
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')?.setAttribute(
          "content",
          theme === "light" ? "default" : "black-translucent",
        );
      })();
    </script>
    <style>
      html,body,#app{width:100%;height:100%;margin:0}body{background:#000;color:#e8e1d2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.boot-splash{display:grid;min-height:100%;place-items:center;background:#000}.boot-splash span{width:24px;height:24px;border:2px solid #333;border-top-color:#d2ae4f;border-radius:50%;animation:boot-spin .8s linear infinite}:root[data-theme="light"] body,:root[data-theme="light"] .boot-splash{background:#f4f6f3;color:#202420}:root[data-theme="light"] .boot-splash span{border-color:#cbd1cb;border-top-color:#263129}@keyframes boot-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.boot-splash span{animation:none}}
    </style>
    <title>Codex Terminal</title>
  </head>
  <body>
    <div id="app"><main class="boot-splash" aria-label="Chargement"><span aria-hidden="true"></span></main></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
